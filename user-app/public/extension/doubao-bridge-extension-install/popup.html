<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>豆包填入助手</title>
    <style>
      body {
        font: 13px/1.5 system-ui, sans-serif;
        margin: 12px;
        min-width: 320px;
      }
      code {
        display: block;
        margin: 8px 0;
        padding: 8px;
        background: #f4f4f5;
        border-radius: 6px;
        word-break: break-all;
        user-select: all;
      }
      button {
        margin: 4px 8px 4px 0;
        padding: 6px 12px;
        cursor: pointer;
      }
      p {
        margin: 0 0 8px;
        color: #444;
      }
      .warn {
        color: #b45309;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <p><strong>扩展 ID</strong>（复制到生图页 → 连接设置）</p>
    <code id="ext-id">加载中…</code>
    <button type="button" id="copy-id-btn">复制 ID</button>
    <button type="button" id="test-fill-btn">在豆包页测试填入</button>
    <p id="test-result" style="font-size: 12px; color: #666"></p>
    <p class="warn">
      若生图页报 Invalid extension id：在 chrome://extensions 点<strong>重新加载</strong>本扩展，再复制上方 ID。
    </p>
    <script src="popup.js"></script>
  </body>
</html>
